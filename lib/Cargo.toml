[package]
name = "yniffi"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dependencies]
# Yrs 0.28.0 + Relay patches pending upstream (y-crdt#656, #657, #674): boldflight/y-crdt branch relay
yrs = { git = "https://github.com/boldflight/y-crdt.git", rev = "7a5b478d3daaac14ea01ec1a7ad786a8dbe44b03", features = ["sync"] }
thiserror = "1.0.38"
uniffi = "0.27.1"
serde_json = "1.0"

[build-dependencies]
uniffi = { version = "0.27.1", features = [ "build" ] }

[dev-dependencies]
base64 = "0.22"

[lib]
name = "uniffi_yniffi"
path = "src/lib.rs"
crate-type = ["staticlib"]
